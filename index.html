<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>你的内心住着什么怪物</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --card2: #222;
      --red: #c0392b;
      --red2: #e74c3c;
      --text: #e0e0e0;
      --dim: #666;
      --gold: #d4af37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .hidden { display: none !important; }

    /* 首页 */
    .home-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 90vh; text-align: center;
      position: relative;
      overflow: hidden;
    }
    .home-screen::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(192,57,43,0.08) 0%, transparent 60%);
      animation: pulseBg 4s ease-in-out infinite;
    }
    @keyframes pulseBg {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .home-title {
      font-size: 56px; font-weight: 900;
      background: linear-gradient(135deg, #c0392b, #e74c3c, #c0392b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      position: relative;
      text-shadow: 0 0 40px rgba(192,57,43,0.3);
    }
    .home-subtitle { font-size: 18px; color: var(--dim); margin-top: 12px; position: relative; }
    .home-divider {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 20px auto 30px;
    }
    .home-card {
      background: var(--card);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      position: relative;
      box-shadow: 0 0 30px rgba(192,57,43,0.05);
    }
    .home-card p { font-size: 15px; color: var(--dim); line-height: 1.8; }
    .home-card .highlight { color: var(--red2); font-weight: 600; }

    .btn-primary {
      display: block; width: 100%; max-width: 280px;
      padding: 16px 24px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: #fff; font-size: 18px; font-weight: 700;
      text-align: center; cursor: pointer;
      box-shadow: 0 8px 32px rgba(192,57,43,0.35);
      transition: all .15s ease;
      position: relative;
    }
    .btn-primary:active { transform: translateY(1px); box-shadow: 0 4px 16px rgba(192,57,43,0.25); }

    /* 答题页 */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .quiz-header span { font-size: 13px; color: var(--dim); }
    .quiz-header .num { color: var(--red2); font-weight: 700; }
    .progress-wrap { height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.08); margin-bottom: 28px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--red), var(--red2)); border-radius: 2px; transition: width .35s ease; }
    .question-tag {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      background: rgba(192,57,43,0.12); color: var(--red2);
      font-size: 12px; font-weight: 600; margin-bottom: 14px;
      border: 1px solid rgba(192,57,43,0.15);
    }
    .question-title { font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 24px; }
    .option-list { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      text-align: left; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: var(--card);
      cursor: pointer; font-size: 15px; color: var(--text);
      transition: all .15s ease;
    }
    .option-btn:active {
      transform: scale(.985);
      border-color: rgba(192,57,43,0.4);
      background: #1a0a0a;
    }
    .option-label {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.06); font-size: 12px; font-weight: 700;
      color: var(--dim); margin-right: 10px;
    }

    /* 结果页 */
    .result-screen { text-align: center; }
    .result-rarity {
      display: inline-block; padding: 6px 16px; border-radius: 4px;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      margin-bottom: 16px;
      animation: flicker 2s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .result-monster {
      width: 160px; height: 160px; margin: 0 auto 16px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px;
      position: relative;
    }
    .result-monster::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 22px;
      border: 1px solid rgba(192,57,43,0.2);
    }
    .result-name { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .result-divider { width: 48px; height: 2px; background: var(--red); border-radius: 1px; margin: 12px auto 20px; }
    .result-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px; padding: 20px;
      margin-bottom: 16px; text-align: left;
    }
    .result-desc { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.8; }
    .result-tagline {
      background: rgba(192,57,43,0.08);
      border-left: 3px solid var(--red);
      padding: 12px 14px; border-radius: 0 8px 8px 0;
      font-size: 14px; color: var(--red2); font-weight: 500;
      margin-top: 12px;
    }
    .result-traits { margin-top: 16px; }
    .trait-tag {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      background: rgba(255,255,255,0.04); color: var(--dim);
      font-size: 12px; margin: 3px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-restart {
      display: block; width: 100%;
      padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--text);
      font-size: 15px; font-weight: 600; cursor: pointer;
      margin-top: 8px; transition: all .15s ease;
    }
    .btn-restart:active { background: var(--card); }

    /* 底部 */
    .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 11px; color: rgba(255,255,255,0.2); text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app"></div>

<script>

// ==================== 隐藏人格 ====================
const hiddenPersonalities = [

    }

// ==================== 核心算法 ====================
function calculatePersonality(answers) {
  const scores = {};

  answers.forEach((optIdx, qIdx) => {
    const q = questions[qIdx];
    const opt = q?.options[optIdx];
    if (opt?.scores) {
      Object.entries(opt.scores).forEach(([dim, val]) => {
        scores[dim] = (scores[dim] || 0) + val;
      });
    }
  });

  // 隐藏人格判定
  for (const hidden of hiddenPersonalities) {
    if (hidden.condition(answers)) {
      if (hidden.rarity === "legendary") { if (Math.random() > 0.5) continue; }
      else if (hidden.rarity === "superRare") { if (Math.random() > 0.4) continue; }
      return { personality: hidden, isHidden: true, scores, answers };
    }
  }

  // 基础人格匹配
  let bestMatch = personalities[0];
  let bestScore = -Infinity;
  for (const p of personalities) {
    const total = p.dimensions.reduce((sum, dim) => sum + (scores[dim] || 0), 0);
    if (total > bestScore) {
      bestScore = total;
      bestMatch = p;
    }
  }

  return { personality: bestMatch, isHidden: false, scores, answers };
}

// ==================== UI ====================
const app = document.getElementById('app');
let answers = [];
let current = 0;

function renderHome() {
  app.innerHTML = `
    <div class="home-screen">
      <div class="home-title">内心怪物</div>
      <p class="home-subtitle">测测你心里住着什么怪物</p>
      <div class="home-divider"></div>
      <div class="home-card">
        <p>14 道暗黑拷问，挖出你内心深处那只<span class="highlight">不敢见人</span>的怪物</p>
        <p style="margin-top:12px;font-size:13px;color:rgba(255,255,255,0.3);">⚠️ 结果可能引起不适，玻璃心慎入</p>
      </div>
      <button class="btn-primary" onclick="startQuiz()">开始直面内心</button>
      <div class="footer">仅供娱乐 · 不构成心理诊断</div>
    </div>
  `;
}

function getProgressText(idx) {
  if (idx < 4) return '扒开你的伪装...';
  if (idx < 9) return '逼近阴暗面...';
  if (idx < 12) return '你的怪物在骚动...';
  return '最后揭晓...';
}

function renderQuestion() {
  const q = questions[current];
  const progress = (current / questions.length) * 100;
  app.innerHTML = `
    <div>
      <div class="quiz-header">
        <span>${getProgressText(current)}</span>
        <span class="num">${current + 1} / ${questions.length}</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
      <span class="question-tag">第 ${current + 1} 问</span>
      <h2 class="question-title">${q.title}</h2>
      <div class="option-list">
        ${q.options.map((opt, idx) => `
          <button class="option-btn" onclick="selectOption(${idx})">
            <span class="option-label">${opt.label}</span>
            <span>${opt.text}</span>
          </button>
        `).join('')}
      </div>
      <div class="footer">所有数据仅本地运算，不收集隐私</div>
    </div>
  `;
}

function selectOption(idx) {
  answers.push(idx);
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    const result = calculatePersonality(answers);
    renderResult(result);
  }
}

function renderResult({ personality, isHidden, scores }) {
  const rarityMap = {
    rare: { text: '◆ 稀 有 ◆', bg: 'rgba(100,100,255,0.1)', color: '#6c5ce7' },
    superRare: { text: '◆ 超 稀 有 ◆', bg: 'rgba(108,92,231,0.12)', color: '#a29bfe' },
    legendary: { text: '◆ 传 说 级 ◆', bg: 'rgba(212,175,55,0.1)', color: '#d4af37', border: '#d4af37' },
  };
  const rarity = isHidden ? rarityMap[personality.rarity] : null;

  // 收集高分维度作为标签
  const topTraits = Object.entries(scores)
    .sort(([,a], [,b]) => b - a)
    .slice(0, 4)
    .filter(([,v]) => v > 0)
    .map(([k]) => k);

  const rarityHtml = rarity
    ? `<div class="result-rarity" style="background:${rarity.bg};color:${rarity.color};border:1px solid ${rarity.color}30">${rarity.text}</div>`
    : '';

  app.innerHTML = `
    <div class="result-screen">
      <div style="padding:20px 0 10px">
        <div style="font-size:12px;color:var(--dim);letter-spacing:4px;margin-bottom:8px;">— 揭 晓 —</div>
        ${rarityHtml}
      </div>
      <div class="result-monster" style="background:radial-gradient(circle, ${personality.color}15, transparent 70%)">
        ${personality.emoji}
      </div>
      <div class="result-name" style="color:${personality.color}">${personality.name.replace(/^.{1,2}\s/, '')}</div>
      <div class="result-divider"></div>

      <div class="result-card">
        <div class="result-desc">${personality.description}</div>
        <div class="result-tagline">${personality.tagline}</div>
        ${personality.traits ? `
        <div class="result-traits">
          ${personality.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
        </div>` : ''}
      </div>

      <button class="btn-primary" onclick="shareResult()" style="margin-top:12px;">📸 截图发朋友圈</button>
      <button class="btn-restart" onclick="startQuiz()">再测一次（看看你还能多黑暗）</button>
      <div class="footer">仅供娱乐 · 不构成心理诊断<br>如果你发现你的怪物过于真实，建议找个人聊聊</div>
    </div>
  `;
}

function shareResult() {
  // 引导截图
  app.innerHTML = app.innerHTML.replace(
    '<button class="btn-primary" onclick="shareResult()" style="margin-top:12px;">📸 截图发朋友圈</button>',
    '<div style="padding:12px;background:var(--card);border-radius:12px;font-size:13px;color:var(--dim);margin-top:12px;animation:flicker 1s infinite;">📱 截图保存，分享到朋友圈或微信群</div>'
  );
}

function startQuiz() {
  answers = [];
  current = 0;
  renderQuestion();
}

// 启动
renderHome();
</script>
