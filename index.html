<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>你的内心住着什么怪物</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --card2: #222;
      --red: #c0392b;
      --red2: #e74c3c;
      --text: #e0e0e0;
      --dim: #666;
      --gold: #d4af37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .hidden { display: none !important; }

    /* 首页 */
    .home-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 90vh; text-align: center;
      position: relative;
      overflow: hidden;
    }
    .home-screen::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(192,57,43,0.08) 0%, transparent 60%);
      animation: pulseBg 4s ease-in-out infinite;
    }
    @keyframes pulseBg {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .home-title {
      font-size: 56px; font-weight: 900;
      background: linear-gradient(135deg, #c0392b, #e74c3c, #c0392b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      position: relative;
      text-shadow: 0 0 40px rgba(192,57,43,0.3);
    }
    .home-subtitle { font-size: 18px; color: var(--dim); margin-top: 12px; position: relative; }
    .home-divider {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 20px auto 30px;
    }
    .home-card {
      background: var(--card);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      position: relative;
      box-shadow: 0 0 30px rgba(192,57,43,0.05);
    }
    .home-card p { font-size: 15px; color: var(--dim); line-height: 1.8; }
    .home-card .highlight { color: var(--red2); font-weight: 600; }

    .btn-primary {
      display: block; width: 100%; max-width: 280px;
      padding: 16px 24px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      color: #fff; font-size: 18px; font-weight: 700;
      text-align: center; cursor: pointer;
      box-shadow: 0 8px 32px rgba(192,57,43,0.35);
      transition: all .15s ease;
      position: relative;
    }
    .btn-primary:active { transform: translateY(1px); box-shadow: 0 4px 16px rgba(192,57,43,0.25); }

    /* 答题页 */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .quiz-header span { font-size: 13px; color: var(--dim); }
    .quiz-header .num { color: var(--red2); font-weight: 700; }
    .progress-wrap { height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.08); margin-bottom: 28px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--red), var(--red2)); border-radius: 2px; transition: width .35s ease; }
    .question-tag {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      background: rgba(192,57,43,0.12); color: var(--red2);
      font-size: 12px; font-weight: 600; margin-bottom: 14px;
      border: 1px solid rgba(192,57,43,0.15);
    }
    .question-title { font-size: 20px; font-weight: 700; line-height: 1.6; margin-bottom: 24px; }
    .option-list { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      text-align: left; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: var(--card);
      cursor: pointer; font-size: 15px; color: var(--text);
      transition: all .15s ease;
    }
    .option-btn:active {
      transform: scale(.985);
      border-color: rgba(192,57,43,0.4);
      background: #1a0a0a;
    }
    .option-label {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.06); font-size: 12px; font-weight: 700;
      color: var(--dim); margin-right: 10px;
    }

    /* 结果页 */
    .result-screen { text-align: center; }
    .result-rarity {
      display: inline-block; padding: 6px 16px; border-radius: 4px;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      margin-bottom: 16px;
      animation: flicker 2s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .result-monster {
      width: 160px; height: 160px; margin: 0 auto 16px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px;
      position: relative;
    }
    .result-monster::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 22px;
      border: 1px solid rgba(192,57,43,0.2);
    }
    .result-name { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .result-divider { width: 48px; height: 2px; background: var(--red); border-radius: 1px; margin: 12px auto 20px; }
    .result-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px; padding: 20px;
      margin-bottom: 16px; text-align: left;
    }
    .result-desc { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.8; }
    .result-tagline {
      background: rgba(192,57,43,0.08);
      border-left: 3px solid var(--red);
      padding: 12px 14px; border-radius: 0 8px 8px 0;
      font-size: 14px; color: var(--red2); font-weight: 500;
      margin-top: 12px;
    }
    .result-traits { margin-top: 16px; }
    .trait-tag {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      background: rgba(255,255,255,0.04); color: var(--dim);
      font-size: 12px; margin: 3px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-restart {
      display: block; width: 100%;
      padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--text);
      font-size: 15px; font-weight: 600; cursor: pointer;
      margin-top: 8px; transition: all .15s ease;
    }
    .btn-restart:active { background: var(--card); }

    /* 底部 */
    .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 11px; color: rgba(255,255,255,0.2); text-align: center; line-height: 1.6; }

    /* 品牌 + 二维码弹窗 */
    .brand-bar {
      margin-top: 24px; padding: 20px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(192,57,43,0.08), rgba(231,76,60,0.04));
      border: 1px solid rgba(192,57,43,0.12);
      text-align: center;
    }
    .brand-name { font-size: 18px; font-weight: 700; color: var(--red2); letter-spacing: 2px; }
    .brand-slogan { font-size: 12px; color: var(--dim); margin-top: 6px; }
    .qrcode-btn {
      display: inline-block; margin-top: 12px; padding: 10px 24px;
      border-radius: 8px; border: 1px solid var(--red2);
      background: transparent; color: var(--red2); font-size: 13px;
      cursor: pointer; transition: all .15s ease;
    }
    .qrcode-btn:active { background: rgba(192,57,43,0.1); }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff; border-radius: 20px; padding: 36px 32px 28px;
      width: 300px; text-align: center;
    }
    .modal-box img { width: 200px; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
    .modal-box .tip { color: #333; font-size: 15px; font-weight: 600; margin-top: 16px; }
    .modal-box .subtip { color: #999; font-size: 12px; margin-top: 4px; }
    .modal-close {
      display: inline-block; margin-top: 16px; padding: 8px 32px;
      border-radius: 6px; border: none; background: #eee;
      color: #333; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>

// ==================== 核心算法 ====================
function calculatePersonality(answers) {
  const scores = {};

  answers.forEach((optIdx, qIdx) => {
    const q = questions[qIdx];
    const opt = q?.options[optIdx];
    if (opt?.scores) {
      Object.entries(opt.scores).forEach(([dim, val]) => {
        scores[dim] = (scores[dim] || 0) + val;
      });
    }
  });

  // 隐藏人格判定
  for (const hidden of hiddenPersonalities) {
    if (hidden.condition(answers)) {
      if (hidden.rarity === "legendary") { if (Math.random() > 0.5) continue; }
      else if (hidden.rarity === "superRare") { if (Math.random() > 0.4) continue; }
      return { personality: hidden, isHidden: true, scores, answers };
    }
  }

  // 基础人格匹配
  let bestMatch = personalities[0];
  let bestScore = -Infinity;
  for (const p of personalities) {
    const total = p.dimensions.reduce((sum, dim) => sum + (scores[dim] || 0), 0);
    if (total > bestScore) {
      bestScore = total;
      bestMatch = p;
    }
  }

  return { personality: bestMatch, isHidden: false, scores, answers };
}

function getProgressText(idx) {

  return '最后揭晓...';
}

function renderQuestion() {
  const q = questions[current];
  const progress = (current / questions.length) * 100;
  app.innerHTML = `

      <div class="option-list">

  `;
}

function selectOption(idx) {
  answers.push(idx);
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {

  }
}
